<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect width="1200" height="560" fill="#0f1117"/>

<text x="600.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#e2e8f0">ReAct Agent 多轮对话对比</text>
<text x="600.0" y="68" text-anchor="middle" font-size="14" fill="#64748b">第二轮提问："那另一家呢？"</text>

<rect x="40" y="100" width="540" height="420" rx="12" fill="#1a1d27" stroke="#2d3148" stroke-width="1.5"/>
<text x="60" y="130" font-size="16" font-weight="700" fill="#f87171">❌  无记忆的 Agent</text>
<text x="60" y="152" font-size="12" fill="#64748b">传统 ReAct，每轮独立，无上下文</text>

<rect x="60" y="180" width="500" height="50" rx="8" fill="#0f1117" stroke="#2d3148"/>
<text x="74" y="202" font-size="11" fill="#64748b">第 1 轮</text>
<text x="74" y="220" font-size="13" fill="#e2e8f0">茅台和五粮液2023年毛利率哪家高？</text>

<rect x="60" y="248" width="500" height="50" rx="8" fill="#0f1117" stroke="#2d3148"/>
<text x="74" y="270" font-size="11" fill="#64748b">第 2 轮</text>
<text x="74" y="288" font-size="13" fill="#e2e8f0">那另一家呢？</text>

<rect x="60" y="316" width="500" height="170" rx="8" fill="#0f1117" stroke="#f87171" stroke-width="1.5"/>
<text x="74" y="340" font-size="11" font-weight="700" fill="#f87171">⚠️  Agent 响应</text>
<text x="74" y="362" font-size="12" fill="#e2e8f0">"另一家"是哪家？请明确公司名。</text>
<text x="74" y="384" font-size="12" fill="#64748b">（要求用户重新表述，</text>
<text x="74" y="400" font-size="12" fill="#64748b">   工具调用失败 0/1，浪费一次）</text>
<text x="74" y="438" font-size="11" font-weight="700" fill="#f87171">结果：体验差 / 需澄清</text>

<rect x="620" y="100" width="540" height="420" rx="12" fill="#1a1d27" stroke="#a78bfa" stroke-width="2"/>
<text x="640" y="130" font-size="16" font-weight="700" fill="#a78bfa">✅  本项目：带记忆的 Agent</text>
<text x="640" y="152" font-size="12" fill="#64748b">短期记忆 + 实体追踪 + 指代消解</text>

<rect x="640" y="180" width="500" height="50" rx="8" fill="#0f1117" stroke="#2d3148"/>
<text x="654" y="202" font-size="11" fill="#64748b">第 1 轮</text>
<text x="654" y="220" font-size="13" fill="#e2e8f0">茅台和五粮液2023年毛利率哪家高？</text>
<rect x="1040" y="190" width="86" height="30" rx="15" fill="#a78bfa" opacity="0.15"/>
<text x="1083" y="210" text-anchor="middle" font-size="11" fill="#a78bfa">存入记忆</text>

<rect x="640" y="248" width="500" height="50" rx="8" fill="#0f1117" stroke="#2d3148"/>
<text x="654" y="270" font-size="11" fill="#64748b">第 2 轮</text>
<text x="654" y="288" font-size="13" fill="#e2e8f0">那另一家呢？</text>

<rect x="640" y="316" width="500" height="56" rx="8" fill="#a78bfa" opacity="0.12" stroke="#a78bfa" stroke-width="1.5"/>
<text x="654" y="338" font-size="11" font-weight="700" fill="#a78bfa">🧠  短期记忆改写</text>
<text x="654" y="358" font-size="12" fill="#e2e8f0">"那另一家呢？"  →  <tspan font-weight="700" fill="#a78bfa">"五粮液呢？"</tspan></text>

<rect x="640" y="388" width="500" height="98" rx="8" fill="#0f1117" stroke="#34d399" stroke-width="1.5"/>
<text x="654" y="410" font-size="11" font-weight="700" fill="#34d399">✓  Agent 响应</text>
<text x="654" y="432" font-size="12" fill="#e2e8f0">五粮液 2023 年毛利率为 75.79%，</text>
<text x="654" y="450" font-size="12" fill="#e2e8f0">比茅台低 16.17 个百分点。</text>
<text x="654" y="476" font-size="11" fill="#34d399">结果：一次到位 / 体验流畅</text>

<text x="600.0" y="540" text-anchor="middle" font-size="12" fill="#64748b">仅在 Python 端做指代消解（不改 LLM），可解释、可调试、节省 token</text>
</svg>
