<rect x="820" y="535" width="165" height="45" rx="6" fill="#0f1117" stroke="#2d3148"/>
<text x="902.5" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">calculator</text>
<text x="902.5" y="572" text-anchor="middle" font-size="10" fill="#64748b">数学计算</text>
