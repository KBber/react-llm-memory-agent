<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect width="1100" height="620" fill="#0f1117"/>
<text x="550.0" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">架构与数据流</text>

<rect x="450" y="80" width="200" height="50" rx="25" fill="#1a1d27" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="550" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">👤  User Question</text>
<line x1="550" y1="130" x2="550" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>
<polygon points="550,160 545,150 555,150" fill="#e2e8f0"/>

<rect x="80" y="170" width="320" height="160" rx="12" fill="#1a1d27" stroke="#a78bfa" stroke-width="2"/>
<text x="240" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa">💾  Short-Term Memory</text>
<text x="100" y="230" font-size="12" fill="#64748b">•  JSON 持久化（每个 session 一文件）</text>
<text x="100" y="252" font-size="12" fill="#64748b">•  Entity Tracker：公司 + 指标 + 年份</text>
<text x="100" y="274" font-size="12" fill="#64748b">•  Anaphora Resolver：</text>
<text x="124" y="294" font-size="11" fill="#a78bfa">  contrast（那另一家）/ repeat（再来一次）</text>
<text x="100" y="316" font-size="12" fill="#64748b">•  Metric Focus：沿用上一轮核心指标</text>

<rect x="430" y="170" width="590" height="280" rx="12" fill="#1a1d27" stroke="#38bdf8" stroke-width="2"/>
<text x="725" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8">🔁  ReAct Loop（≤ 10 步）</text>
<rect x="450" y="230" width="170" height="80" rx="8" fill="#0f1117" stroke="#38bdf8" stroke-width="1.5"/>
<text x="535.0" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">Thought</text>
<text x="535.0" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">LLM Reasoning</text>
<rect x="640" y="230" width="170" height="80" rx="8" fill="#0f1117" stroke="#fbbf24" stroke-width="1.5"/>
<text x="725.0" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">Action</text>
<text x="725.0" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Tool Call</text>
<rect x="830" y="230" width="170" height="80" rx="8" fill="#0f1117" stroke="#34d399" stroke-width="1.5"/>
<text x="915.0" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">Observation</text>
<text x="915.0" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Tool Result</text>
<path d="M 620 270 L 630 270" stroke="#e2e8f0" stroke-width="1.2" fill="none"/>
<polygon points="630,270 (630, {265}) (630, {275})" fill="#e2e8f0"/>
<path d="M 810 270 L 820 270" stroke="#e2e8f0" stroke-width="1.2" fill="none"/>
<polygon points="820,270 (820, {265}) (820, {275})" fill="#e2e8f0"/>
<path d="M 915.0 310 Q 640 360, 535.0 310" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
<polygon points="535.0,310 (458, {318}) (458, {302})" fill="#e2e8f0"/>
<text x="725" y="358" text-anchor="middle" font-size="11" fill="#64748b">循环直到 Final Answer 或 max_steps</text>
<rect x="540" y="370" width="370" height="55" rx="10" fill="#a78bfa" opacity="0.18" stroke="#a78bfa" stroke-width="1.5"/>
<text x="725" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#a78bfa">✅  Final Answer</text>

<rect x="80" y="490" width="940" height="100" rx="12" fill="#1a1d27" stroke="#2d3148" stroke-width="1.5"/>
<text x="550" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">🔧  5 Tools</text>
