<text x="362.5" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">rag_search</text>
<text x="362.5" y="572" text-anchor="middle" font-size="10" fill="#64748b">FAISS 语义</text>
<rect x="460" y="535" width="165" height="45" rx="6" fill="#0f1117" stroke="#2d3148"/>
<text x="542.5" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">financial_indicator</text>
<text x="542.5" y="572" text-anchor="middle" font-size="10" fill="#64748b">AkShare 财务</text>
<rect x="640" y="535" width="165" height="45" rx="6" fill="#0f1117" stroke="#2d3148"/>
<text x="722.5" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">stock_price</text>
